# Copy this file, fill every value with a real random secret, and apply it
# before the Deployment. Never commit the filled copy.
apiVersion: v1
kind: Secret
metadata:
  name: sdkfit-secrets
  labels:
    app: sdkfit
type: Opaque
stringData:
  api-token: replace-with-a-long-random-api-token
  webhook-secret: replace-with-a-long-random-webhook-secret
  database-url: postgresql://sdkfit:replace-with-a-long-random-password@sdkfit-postgres:5432/sdkfit
  postgres-password: replace-with-a-long-random-password
---
# The GitHub App private key, mounted read-only at /secrets/app.pem.
apiVersion: v1
kind: Secret
metadata:
  name: sdkfit-app-key
  labels:
    app: sdkfit
type: Opaque
stringData:
  app.pem: |
    -----BEGIN PRIVATE KEY-----
    replace-with-the-github-app-private-key
    -----END PRIVATE KEY-----
