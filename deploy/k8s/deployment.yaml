apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdkfit
  labels:
    app: sdkfit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sdkfit
  template:
    metadata:
      labels:
        app: sdkfit
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sdkfit
          # Published by the release workflow; pin the release tag in production.
          image: ghcr.io/haqaliz/sdkfit:latest
          imagePullPolicy: IfNotPresent
          args:
            - provider
            - serve
            - --bundles
            - /data/bundles
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --workers
            - "4"
            - --app-id
            - $(SDKFIT_APP_ID)
            - --app-installation-id
            - $(SDKFIT_APP_INSTALLATION_ID)
            - --app-private-key
            - /secrets/app.pem
          env:
            - name: SDKFIT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sdkfit-secrets
                  key: database-url
            - name: SDKFIT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sdkfit-secrets
                  key: api-token
            - name: SDKFIT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: sdkfit-secrets
                  key: webhook-secret
            - name: SDKFIT_APP_ID
              valueFrom:
                configMapKeyRef:
                  name: sdkfit-config
                  key: app-id
            - name: SDKFIT_APP_INSTALLATION_ID
              valueFrom:
                configMapKeyRef:
                  name: sdkfit-config
                  key: app-installation-id
            - name: GIT_AUTHOR_NAME
              valueFrom:
                configMapKeyRef:
                  name: sdkfit-config
                  key: git-author-name
            - name: GIT_AUTHOR_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: sdkfit-config
                  key: git-author-email
            - name: GIT_COMMITTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: sdkfit-config
                  key: git-author-name
            - name: GIT_COMMITTER_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: sdkfit-config
                  key: git-author-email
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: bundles
              mountPath: /data/bundles
              readOnly: true
            - name: app-key
              mountPath: /secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bundles
          persistentVolumeClaim:
            claimName: sdkfit-bundles
        - name: app-key
          secret:
            secretName: sdkfit-app-key
        - name: tmp
          emptyDir: {}
