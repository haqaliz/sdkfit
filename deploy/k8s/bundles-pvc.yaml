# The bundle directory shared by every service replica. A ReadWriteMany class
# (cloud file share / NFS) is required; each pod mounts it read-only.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sdkfit-bundles
  labels:
    app: sdkfit
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 1Gi
